<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0f"><meta name="robots" content="noindex,nofollow,noarchive"><title>ETF Night Watch</title><style>
:root{color-scheme:dark;--bg:#090b0f;--p:#141820;--l:#252b35;--t:#f3f6fa;--m:#8993a2;--up:#ff6578;--dn:#5aa8ff;--a:#c9ff59}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 380px at 50% -120px,#252d35,#090b0f 58%);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:720px;margin:auto;padding:30px 14px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{margin:4px 0;font-size:30px;letter-spacing:-1.2px}header p{margin:6px 0 22px;color:var(--m);font-size:13px}.ey{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--a)}button{border:1px solid var(--l);background:#171b22;color:white;border-radius:12px;padding:10px 13px;font-size:18px}.status,.card,.sum>div{background:linear-gradient(#151922,#11151b);border:1px solid var(--l);border-radius:17px}.status{padding:13px 15px;color:#dce2e9;font-size:12px;margin-bottom:10px}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px}.sum>div{padding:12px}.sum small,.meta,.sub{color:var(--m);font-size:10px}.sum b{display:block;margin-top:5px;font-size:17px}.hd{display:flex;justify-content:space-between;align-items:end;margin:0 2px 10px}.hd h2{font-size:18px;margin:0}.cards{display:grid;gap:10px}.card{padding:16px}.top,.price,.grid{display:flex;justify-content:space-between;gap:10px}.card h3{font-size:16px;margin:3px 0}.badge{font-size:10px;border:1px solid var(--l);border-radius:999px;padding:5px 8px;height:max-content}.price{align-items:end;margin:16px 0}.price strong{font-size:24px}.move{font-size:19px;font-weight:800}.up{color:var(--up)}.dn{color:var(--dn)}.grid>div{flex:1;background:#0c0f14;border-radius:10px;padding:9px}.grid span,.grid b{display:block}.grid span{font-size:9px;color:var(--m);margin-bottom:4px}.grid b{font-size:12px}.note{margin-top:18px;padding:14px;border:1px dashed #303744;border-radius:14px;color:var(--m);font-size:10px;line-height:1.6}.bad{color:#ffd36f}.ok{color:var(--a)}@media(max-width:520px){.sum{grid-template-columns:1fr 1fr}.sum>div:last-child{grid-column:1/-1}.grid{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><main class="w"><header><div><div class="ey">● PERSONAL LIVE ESTIMATE</div><h1>ETF Night Watch</h1><p>최근 확정 한국장 종가 이후의 미국 기초자산·선물·환율 변화를 반영한다.</p></div><button id="r">↻</button></header><div id="s" class="status">불러오는 중…</div><section id="sum" class="sum"></section><div class="hd"><h2>내 ETF</h2><span id="u" class="meta"></span></div><section id="c" class="cards"></section><div class="note">참고용 추정치. 프록시 ETF와 선물 보정이 포함될 수 있으며 실제 시초가·체결가는 수급, 괴리율, LP 호가 등에 따라 달라질 수 있다. v1.5.0 STABLE</div></main><script>
const W=n=>Number.isFinite(n)?Math.round(n).toLocaleString('ko-KR')+'원':'—',P=n=>Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(2)+'%':'—',C=n=>!Number.isFinite(n)?'':n>0?'up':n<0?'dn':'',A=n=>!Number.isFinite(n)?'—':n<90?n+'초':n<5400?Math.round(n/60)+'분':Math.round(n/3600)+'시간',s=document.querySelector('#s'),c=document.querySelector('#c'),sum=document.querySelector('#sum'),u=document.querySelector('#u'),r=document.querySelector('#r');
async function load(){r.disabled=true;s.textContent='계산 중…';try{const x=await fetch('/api/estimate'),d=await x.json();if(!x.ok)throw Error(d.error||x.status);const good=d.items.filter(i=>i.dataOk),avg=good.length?good.reduce((a,i)=>a+i.expectedMovePct,0)/good.length:null,fx=d.fx?.movePct;s.innerHTML=`<b>${d.session.label}</b> · KRX ${d.krxCloseDate} 15:30 기준 · ${good.length}/7 계산 정상 · 소스 ${d.sourceSummary.requestedSymbols}개`;sum.innerHTML=`<div><small>7종 평균</small><b class="${C(avg)}">${P(avg)}</b></div><div><small>원/달러${d.fx.fallback?' (미반영)':''}</small><b class="${C(fx)}">${P(fx)}</b></div><div><small>현재 세션</small><b>${d.session.code}</b></div>`;c.innerHTML=d.items.map(i=>`<article class="card"><div class="top"><div><div class="meta">${i.code} · ${i.mode||'—'}</div><h3>${i.name}</h3><div class="sub">${i.modelLabel}</div></div><span class="badge ${i.dataOk?'ok':'bad'}">${i.qualityLabel}</span></div><div class="price"><div><span class="sub">현재 추정</span><strong>${W(i.estimate)}</strong></div><div class="move ${C(i.expectedMovePct)}">${P(i.expectedMovePct)}</div></div><div class="grid"><div><span>KRX 종가</span><b>${W(i.marketClose)}</b></div><div><span>기초자산</span><b class="${C(i.underlyingMovePct)}">${P(i.underlyingMovePct)}</b></div><div><span>환율</span><b class="${C(i.fxMovePct)}">${P(i.fxMovePct)}</b></div><div><span>데이터 경과</span><b>${A(i.sourceAgeSec)}</b></div></div></article>`).join('');u.textContent=new Date(d.generatedAt).toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){s.textContent='불러오기 실패: '+e.message;sum.innerHTML='';c.innerHTML=''}finally{r.disabled=false}}
r.onclick=load;load();setInterval(load,60000);
</script></body></html>
