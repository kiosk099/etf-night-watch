name: Temporary 20D Backtest
on:
  push:
    branches: [analysis/backtest-20d-20260919]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 20-day backtest and proxy search
        run: node scripts/backtest-20d.js
