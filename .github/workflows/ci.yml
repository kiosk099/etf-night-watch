name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Syntax checks
        run: npm run check

  production-smoke:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Verify production API
        shell: bash
        run: |
          set -u
          URL="https://etf-night-watch.vercel.app/api/estimate"
          for i in {1..24}; do
            code="$(curl -sS --max-time 20 -o response.json -w "%{http_code}" "$URL" || true)"
            if [ "$code" = "200" ]; then
              if node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          const ok = Array.isArray(d.items) ? d.items.filter(x => x && x.dataOk).length : 0;
          const requested = d.sourceSummary?.requestedSymbols;
          if (d.version !== '1.6.0-stable') throw new Error('unexpected version: ' + d.version);
          if (!Array.isArray(d.items) || d.items.length !== 7) throw new Error('expected 7 ETF items');
          if (!d.krxCloseDate) throw new Error('missing krxCloseDate');
          if (!d.snapshot?.asOfAt) throw new Error('missing common as-of');
          if (!Number.isFinite(d.snapshot?.lagSec) || d.snapshot.lagSec < 600) throw new Error('safe lag missing: ' + d.snapshot?.lagSec);
          if (!Number.isFinite(requested) || requested > 16) throw new Error('unexpected requestedSymbols: ' + requested);
          if (ok < 5) throw new Error('too few usable ETF estimates: ' + ok);
          const semi = d.items.find(x => x.code === '381180');
          const ai = d.items.find(x => x.code === '487230');
          const gold = d.items.find(x => x.code === '0072R0');
          if (semi?.calibrationScale !== 0.75) throw new Error('semi calibration missing');
          if (ai?.calibrationScale !== 0.8) throw new Error('AI calibration missing');
          if (!['basket','basket-fallback'].includes(ai?.mode)) throw new Error('AI basket mode missing: ' + ai?.mode);
          if (gold?.calibrationScale !== 0.8) throw new Error('gold calibration missing');
          console.log(JSON.stringify({
            version: d.version,
            krxCloseDate: d.krxCloseDate,
            usableEtfCount: ok,
            requestedSymbols: requested,
            chartFailures: d.sourceSummary?.chartFailures,
            dailyFailures: d.sourceSummary?.dailyFailures,
            session: d.session?.code
          }, null, 2));
          NODE
              then
                exit 0
              fi
            fi
            echo "attempt $i: HTTP $code; production not ready/healthy yet"
            cat response.json 2>/dev/null | head -c 1000 || true
            echo
            sleep 5
          done
          echo "production smoke test failed"
          exit 1
